name = "cnf"
grammar = "cnf"
path_suffixes = ["cnf"]
line_comments = ["# "]
tab_size = 4
hard_tabs = false
autoclose_before = ",]}\n\t "
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
# A line that ends in `key:` (optionally followed by a comment) opens a block.
increase_indent_pattern = '^[^#]*:\s*(#.*)?$'
